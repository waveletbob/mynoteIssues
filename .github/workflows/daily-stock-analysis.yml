name: 每日股票分析

# 在 mynoteIssues 仓库内运行：检出本仓库的 stocks.txt 配置 -> clone 上游 daily_stock_analysis -> 装依赖 -> 跑分析。
# 所有 Secret/Variable 读取自本仓库（waveletbob/mynoteIssues）的 Settings -> Secrets and variables -> Actions。
# 需要存在名为 STOCK_LIST 的 Environment（Settings -> Environments 新建，可为空）。

on:
  # 定时触发 - 每天北京时间 18:00 (UTC 10:00)
  schedule:
    - cron: '0 10 * * 1-5'     # 周一到周五，UTC 10:00 = 北京时间 18:00

  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full          # 完整分析（股票+大盘）
          - market-only   # 仅大盘复盘
          - stocks-only   # 仅股票分析
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean
      upstream_ref:
        description: '上游 daily_stock_analysis 的分支/tag'
        required: false
        default: 'main'

# 并发控制：同一时间只运行一个分析任务
concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment: STOCK_LIST
    timeout-minutes: ${{ fromJSON(vars.ANALYSIS_TIMEOUT_MINUTES || '30') }}

    steps:
      - name: 随机延迟（避免固定时间访问）
        run: sleep $((RANDOM % 60))

      - name: 检出本仓库（获取 stocks.txt 配置）
        uses: actions/checkout@v5

      - name: 克隆上游 daily_stock_analysis
        env:
          UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'main' }}
        run: |
          git clone --depth 1 --branch "${UPSTREAM_REF}" https://github.com/ZhuLinsen/daily_stock_analysis.git upstream
          echo "上游版本: $(git -C upstream log -1 --format='%H %ci')"

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r upstream/requirements.txt

      - name: 创建必要目录
        run: mkdir -p upstream/data upstream/logs upstream/reports

      - name: 加载自选股清单（stocks.txt）
        run: |
          FILE="daily_stock_analysis_deploy/stocks.txt"
          if [ -f "$FILE" ]; then
            LIST=$(grep -v '^\s*#' "$FILE" | grep -v '^\s*$' | sed 's/[[:space:]]*#.*$//' | paste -sd, -)
          fi
          LIST="${LIST:-600519}"
          echo "STOCK_LIST=$LIST" >> "$GITHUB_ENV"
          echo "::notice::自选股清单: $LIST"

      - name: 执行股票分析
        working-directory: upstream
        env:
          # ==========================================
          # AI 配置（至少配一个 Key 即可运行）
          # ==========================================
          GENERATION_BACKEND: ${{ vars.GENERATION_BACKEND || secrets.GENERATION_BACKEND }}
          GENERATION_FALLBACK_BACKEND: ${{ vars.GENERATION_FALLBACK_BACKEND || secrets.GENERATION_FALLBACK_BACKEND || 'litellm' }}

          # Gemini（免费额度，推荐）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || secrets.GEMINI_MODEL_FALLBACK || 'gemini-2.5-flash' }}
          GEMINI_REQUEST_DELAY: '3.0'

          # AIHubMix（国内用户推荐）
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}

          # OpenAI 兼容
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}

          # DeepSeek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}

          # Anthropic / Claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEYS: ${{ secrets.ANTHROPIC_API_KEYS }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || secrets.ANTHROPIC_MODEL || 'claude-3-5-sonnet-20241022' }}

          # ==========================================
          # 数据源（可选）
          # ==========================================
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          REALTIME_SOURCE_PRIORITY: ${{ vars.REALTIME_SOURCE_PRIORITY || 'tencent,akshare_sina,efinance,akshare_em' }}

          # ==========================================
          # 搜索服务（可选）
          # ==========================================
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}

          # ==========================================
          # 通知渠道（按需配置，可多选）
          # ==========================================
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          WECHAT_MSG_TYPE: ${{ vars.WECHAT_MSG_TYPE || 'markdown' }}

          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # 邮件：复用本仓库现有 SMTP_* / NOTIFY_TO Secret（上游按发件邮箱域名自动识别 SMTP 主机/端口）
          # 优先级：EMAIL_* > SMTP_* / NOTIFY_TO（如需单独覆盖可再建 EMAIL_SENDER 等 Secret）
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER || secrets.SMTP_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD || secrets.SMTP_PASS }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS || secrets.NOTIFY_TO }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || 'daily_stock_analysis股票分析助手' }}

          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC || secrets.PUSHPLUS_TOPIC }}

          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}

          SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}

          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          # ==========================================
          # 自选股 + 运行配置
          # ==========================================
          STOCK_LIST: ${{ env.STOCK_LIST }}
          MARKET_REVIEW_REGION: ${{ vars.MARKET_REVIEW_REGION || 'cn' }}
          MARKET_REVIEW_COLOR_SCHEME: ${{ vars.MARKET_REVIEW_COLOR_SCHEME || 'green_up' }}
          REPORT_TYPE: ${{ vars.REPORT_TYPE || 'simple' }}
          REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE || '' }}
          REPORT_SHOW_LLM_MODEL: ${{ vars.REPORT_SHOW_LLM_MODEL || 'true' }}
          SINGLE_STOCK_NOTIFY: ${{ vars.SINGLE_STOCK_NOTIFY || 'false' }}
          # 大盘复盘默认关闭：GitHub Actions 海外 runner 访问东财/新浪指数接口易卡死（akshare 无超时）。
          # 想恢复大盘复盘：建 Variable MARKET_REVIEW_ENABLED=true 覆盖（建议配合国内 self-hosted runner）。
          MARKET_REVIEW_ENABLED: ${{ vars.MARKET_REVIEW_ENABLED || 'false' }}
          ANALYSIS_DELAY: ${{ vars.ANALYSIS_DELAY || '0' }}
          TRADING_DAY_CHECK_ENABLED: ${{ vars.TRADING_DAY_CHECK_ENABLED || 'true' }}

          # ==========================================
          # 系统配置
          # ==========================================
          LOG_LEVEL: INFO
          MAX_WORKERS: ${{ vars.MAX_WORKERS || '1' }}
          ENABLE_CHIP_DISTRIBUTION: ${{ vars.ENABLE_CHIP_DISTRIBUTION || 'false' }}

        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"

          echo "=========================================="
          echo "🚀 A股自选股智能分析系统（上游 clone 模式）"
          echo "=========================================="
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "🎯 运行模式: $MODE"
          echo "📊 自选股: $STOCK_LIST"
          echo "📝 报告类型: $REPORT_TYPE"
          echo "  Gemini Key: $([ -n "$GEMINI_API_KEY" ] && echo '✅' || echo '❌')"
          echo "  AIHubMix:   $([ -n "$AIHUBMIX_KEY" ] && echo '✅' || echo '⚪')"
          echo "  OpenAI:     $([ -n "$OPENAI_API_KEY" ] && echo '✅' || echo '⚪')"
          echo "  DeepSeek:   $([ -n "$DEEPSEEK_API_KEY" ] && echo '✅' || echo '⚪')"
          echo "  Anthropic:  $([ -n "$ANTHROPIC_API_KEY" ] && echo '✅' || echo '⚪')"
          echo "  PushPlus:   $([ -n "$PUSHPLUS_TOKEN" ] && echo '✅' || echo '⚪')"
          echo "  企业微信:   $([ -n "$WECHAT_WEBHOOK_URL" ] && echo '✅' || echo '⚪')"
          echo "  飞书:       $([ -n "$FEISHU_WEBHOOK_URL" ] && echo '✅' || echo '⚪')"
          echo "  Telegram:   $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo '✅' || echo '⚪')"
          echo "  邮件:       $([ -n "$EMAIL_SENDER" ] && [ -n "$EMAIL_PASSWORD" ] && echo \"✅ $EMAIL_SENDER -> $EMAIL_RECEIVERS\" || echo '⚪ 未配置')"
          echo "=========================================="

          FORCE_RUN_ARG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_RUN_ARG="--force-run"
            echo "⚡ 已启用强制运行（跳过交易日检查）"
          fi

          if [ "$MODE" = "market-only" ]; then
            python main.py --market-review $FORCE_RUN_ARG
          elif [ "$MODE" = "stocks-only" ]; then
            python main.py --no-market-review $FORCE_RUN_ARG
          else
            python main.py $FORCE_RUN_ARG
          fi

      - name: 上传分析报告
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: analysis-reports-${{ github.run_number }}
          path: |
            upstream/reports/
            upstream/logs/
          retention-days: 30

      - name: 显示运行结果
        if: always()
        working-directory: upstream
        run: |
          echo "=========================================="
          echo "📊 分析完成"
          echo "=========================================="
          if [ -d "reports" ] && [ "$(ls -A reports 2>/dev/null)" ]; then
            ls -la reports/
          else
            echo "⚠️ 未生成报告文件"
          fi
          if ls logs/stock_analysis_*.log >/dev/null 2>&1; then
            echo "📜 最近日志（最后 30 行）:"
            tail -30 logs/stock_analysis_*.log
          fi
